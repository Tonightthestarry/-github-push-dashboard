name: GitHub Daily Push

on:
  schedule:
    # UTC 01:00 / 09:00 / 17:00，即北京时间 09:00 / 17:00 / 次日 01:00
    - cron: '0 1,9,17 * * *'
  workflow_dispatch: # 支持手动重跑

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: gh-daily-push
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 抓取按用户画像定向；脚本内置快照回退：
      # 成功写 data/snapshot.json + data.json（isFallback=false），
      # 失败不覆盖 snapshot，data.json 复制旧快照并置 isFallback=true
      - name: 抓取数据生成 data.json
        continue-on-error: true # 抓取失败也继续：注入回退快照、照常提交最新运行状态
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/fetch_data.mjs

      - name: 注入 data.json 到 index.html
        run: node scripts/inject_data.mjs

      - name: 校验注入一致性
        run: node scripts/inject_data.mjs --check

      - name: 运行验收测试
        run: node test/verify.mjs

      - name: 提交快照与页面
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html data.json data/snapshot.json
          git diff --cached --quiet || git commit -m "chore: 更新推送数据 ($(date -u +'%Y-%m-%d %H:%M UTC'))"
          git push

      - name: 上传 Pages artifact
        if: github.ref == 'refs/heads/master' && always()
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  # 部署独立 job：即使抓取失败也照常发布上次的页面
  deploy:
    if: github.ref == 'refs/heads/master'
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: 发布到 GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
