name: GitHub Daily Push

on:
  schedule:
    # UTC 01:00 / 09:00 / 17:00，即北京时间 09:00 / 17:00 / 次日 01:00
    - cron: '0 1,9,17 * * *'
  workflow_dispatch: # 支持手动重跑

permissions:
  contents: write

concurrency:
  group: gh-daily-push
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 抓取按用户画像定向；脚本内置快照回退：
      # 成功写 data/snapshot.json + data.json（isFallback=false），
      # 失败不覆盖 snapshot，data.json 复制旧快照并置 isFallback=true
      - name: 抓取数据生成 data.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/fetch_data.mjs

      - name: 注入 data.json 到 index.html
        run: node scripts/inject_data.mjs

      - name: 校验注入一致性
        run: node scripts/inject_data.mjs --check

      - name: 运行验收测试
        run: node test/verify.mjs

      - name: 提交快照与页面
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html data.json data/snapshot.json
          git diff --cached --quiet || git commit -m "chore: 更新推送数据 ($(date -u +'%Y-%m-%d %H:%M UTC'))"
          git push

      # 如需部署到 GitHub Pages：仓库 Settings → Pages → Source 选 GitHub Actions，
      # 并取消下面三行注释
      # - uses: actions/upload-pages-artifact@v3
      #   with:
      #     path: .
      # - uses: actions/deploy-pages@v4
