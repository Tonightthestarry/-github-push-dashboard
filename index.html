<html lang="zh-CN">
<head>

<script>
/* 首屏前确定主题，避免明暗闪烁 */
(function () {
  var t = null;
  try { t = localStorage.getItem('gh-dash-theme'); } catch (e) {}
  if (t !== 'light' && t !== 'dark') {
    t = (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
  }
  document.documentElement.setAttribute('data-theme', t);
})();
</script>
<style>
:root {
  --bg: #f6f8fa;
  --panel: #ffffff;
  --border: #d0d7de;
  --text: #1f2328;
  --text-2: #59636e;
  --accent: #0969da;
  --accent-soft: #ddf4e4;
  --accent-text: #1a7f37;
  --chip-bg: #eff1f3;
  --warn-bg: #fff8e6;
  --warn-border: #eac54f;
  --warn-text: #7a5b00;
  --danger-text: #b35900;
  --nav-bg: rgba(246, 248, 250, .92);
  --shadow: 0 1px 2px rgba(31, 35, 40, .06);
  --radius: 10px;
}
[data-theme="dark"] {
  --bg: #0d1117;
  --panel: #161b22;
  --border: #30363d;
  --text: #e6edf3;
  --text-2: #9198a1;
  --accent: #4493f8;
  --accent-soft: #12261e;
  --accent-text: #3fb950;
  --chip-bg: #21262d;
  --warn-bg: #2d2407;
  --warn-border: #7a5b00;
  --warn-text: #eac54f;
  --danger-text: #e3b341;
  --nav-bg: rgba(13, 17, 23, .92);
  --shadow: 0 1px 2px rgba(0, 0, 0, .35);
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif;
  line-height: 1.6;
  transition: background-color .18s ease, color .18s ease;
}
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.wrap { max-width: 1200px; margin: 0 auto; padding: 0 20px; }
[hidden] { display: none !important; }

/* ---------- Hero ---------- */
.hero { position: relative; padding: 40px 0 24px; border-bottom: 1px solid var(--border); }
.hero h1 { margin: 0 0 6px; font-size: 28px; line-height: 1.3; padding-right: 56px; }
.hero .subtitle { margin: 0 0 20px; color: var(--text-2); font-size: 14px; }
.theme-toggle {
  position: absolute; top: 40px; right: 20px;
  width: 40px; height: 40px; border-radius: 50%;
  border: 1px solid var(--border); background: var(--panel); color: var(--text);
  cursor: pointer; display: inline-flex; align-items: center; justify-content: center;
  transition: border-color .15s ease;
}
.theme-toggle:hover { border-color: var(--accent); }
.theme-toggle svg { width: 20px; height: 20px; fill: currentColor; }
.icon-sun { display: none; }
[data-theme="dark"] .icon-sun { display: block; }
[data-theme="dark"] .icon-moon { display: none; }

.banner {
  margin: 0 0 16px; padding: 10px 14px;
  background: var(--warn-bg); border: 1px solid var(--warn-border); border-radius: var(--radius);
  color: var(--warn-text); font-size: 14px;
  display: flex; flex-wrap: wrap; align-items: center; gap: 10px;
}
.banner .spacer { flex: 1 1 auto; }

.kpi-row { display: flex; flex-wrap: wrap; gap: 24px; margin-bottom: 20px; }
.kpi { min-width: 120px; }
.kpi .num {
  display: block; font-size: 34px; font-weight: 700; line-height: 1.2;
  font-variant-numeric: tabular-nums; color: var(--accent-text);
}
.kpi .label { font-size: 13px; color: var(--text-2); }

.stat-cards { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 18px; }
.stat-card {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 8px 14px; background: var(--panel); border: 1px solid var(--border);
  border-radius: 999px; font-size: 14px; color: var(--text);
  box-shadow: var(--shadow); transition: border-color .15s ease, transform .15s ease;
  cursor: pointer;
}
.stat-card:hover { border-color: var(--accent); transform: translateY(-1px); text-decoration: none; }
.stat-card .count {
  font-variant-numeric: tabular-nums; font-weight: 600;
  background: var(--chip-bg); border-radius: 999px; padding: 0 8px; font-size: 13px;
}
.time-row { display: flex; flex-wrap: wrap; gap: 8px 24px; font-size: 13px; color: var(--text-2); }
.time-row b { color: var(--text); font-weight: 600; }

/* ---------- 粘性锚点导航 ---------- */
.nav {
  position: sticky; top: 0; z-index: 50;
  background: var(--nav-bg); backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--border);
}
.nav-inner {
  display: flex; gap: 4px; overflow-x: auto; padding: 10px 20px;
  max-width: 1200px; margin: 0 auto;
  scrollbar-width: none;
}
.nav-inner::-webkit-scrollbar { display: none; }
.nav a {
  flex: 0 0 auto; white-space: nowrap;
  padding: 6px 12px; border-radius: 999px; font-size: 14px; color: var(--text-2);
  border: 1px solid transparent;
  transition: color .15s ease, background-color .15s ease;
}
.nav a:hover { color: var(--text); text-decoration: none; }
.nav a.active { color: var(--accent); background: var(--chip-bg); border-color: var(--border); font-weight: 600; }
.nav .badge {
  display: inline-block; margin-left: 6px; padding: 0 7px;
  font-size: 12px; font-variant-numeric: tabular-nums;
  background: var(--chip-bg); border-radius: 999px; color: var(--text-2);
}
.nav a.active .badge { background: var(--accent); color: #fff; }
.nav a.nav-key { color: var(--accent-text); }

/* ---------- 搜索区 ---------- */
.search-panel {
  background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 18px; box-shadow: var(--shadow);
}
.search-bar { display: flex; flex-wrap: wrap; gap: 10px; }
.search-input {
  flex: 1 1 260px; min-width: 0;
  padding: 11px 14px; font-size: 15px; font-family: inherit;
  color: var(--text); background: var(--bg);
  border: 1px solid var(--border); border-radius: 8px;
  transition: border-color .15s ease;
}
.search-input:focus { outline: none; border-color: var(--accent); }
.search-input::placeholder { color: var(--text-2); }
.btn {
  padding: 11px 18px; font-size: 14px; font-family: inherit; font-weight: 600;
  color: #fff; background: var(--accent); border: 1px solid transparent;
  border-radius: 8px; cursor: pointer; white-space: nowrap;
  transition: opacity .15s ease, border-color .15s ease;
}
.btn:hover { opacity: .9; }
.btn[disabled] { opacity: .55; cursor: default; }
.btn-ghost {
  color: var(--text); background: var(--panel); border: 1px solid var(--border);
  font-weight: 500;
}
.btn-ghost:hover { border-color: var(--accent); opacity: 1; }
.btn-sm { padding: 6px 12px; font-size: 13px; }

.hint { margin: 10px 0 0; font-size: 13px; color: var(--text-2); }
.hint code {
  background: var(--chip-bg); padding: 1px 6px; border-radius: 5px;
  font-size: 12.5px; font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
}
.quick-chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.quick-chip {
  padding: 4px 11px; font-size: 13px; cursor: pointer;
  background: var(--chip-bg); color: var(--text); border: 1px solid transparent;
  border-radius: 999px; font-family: inherit;
  transition: border-color .15s ease, color .15s ease;
}
.quick-chip:hover { border-color: var(--accent); color: var(--accent); }

.search-status {
  margin-top: 14px; padding: 9px 12px; border-radius: 8px;
  font-size: 13px; background: var(--chip-bg); color: var(--text-2);
}
.search-status.is-warn { background: var(--warn-bg); border: 1px solid var(--warn-border); color: var(--warn-text); }
.search-status.is-error { background: var(--warn-bg); border: 1px solid var(--warn-border); color: var(--danger-text); }
.result-bar {
  display: flex; flex-wrap: wrap; align-items: center; gap: 10px;
  margin: 16px 0 4px; font-size: 13px; color: var(--text-2);
}
.result-bar .spacer { flex: 1 1 auto; }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
.seg button {
  padding: 5px 11px; font-size: 13px; font-family: inherit; cursor: pointer;
  background: var(--panel); color: var(--text-2); border: 0; border-right: 1px solid var(--border);
  transition: background-color .15s ease, color .15s ease;
}
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--chip-bg); color: var(--accent); font-weight: 600; }
.local-hits { margin-top: 10px; font-size: 13px; color: var(--text-2); }
@keyframes spin { to { transform: rotate(360deg); } }
.spinner {
  display: inline-block; width: 12px; height: 12px; vertical-align: -1px;
  border: 2px solid var(--text-2); border-top-color: transparent; border-radius: 50%;
  animation: spin .7s linear infinite;
}

/* ---------- 版块与卡片 ---------- */
main { padding: 8px 0 32px; }
.sec { scroll-margin-top: 72px; padding-top: 24px; }
.sec h2 { margin: 0 0 14px; font-size: 20px; }
.sec h2 .sec-count {
  font-size: 14px; font-weight: 500; color: var(--text-2);
  font-variant-numeric: tabular-nums; margin-left: 8px;
}
.sec-desc { margin: -6px 0 14px; font-size: 13px; color: var(--text-2); }
.grid { display: grid; grid-template-columns: 1fr; gap: 16px; }
@media (min-width: 768px) { .grid { grid-template-columns: repeat(2, 1fr); } }
@media (min-width: 1200px) { .grid { grid-template-columns: repeat(3, 1fr); } }

.panel {
  background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 18px; box-shadow: var(--shadow); margin-bottom: 20px;
}
.panel-head { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.panel-head h2 { margin: 0; font-size: 20px; }
.panel-head .spacer { flex: 1 1 auto; }

.card {
  display: flex; flex-direction: column; gap: 8px;
  background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 16px; box-shadow: var(--shadow); min-width: 0;
  content-visibility: auto; contain-intrinsic-size: auto 160px;
  transition: transform .15s ease, border-color .15s ease;
}
.card:hover { transform: translateY(-2px); border-color: var(--accent); }
.card--pick { border-left: 3px solid var(--accent-text); }
.card-head { display: flex; align-items: flex-start; gap: 10px; }
.num-badge {
  flex: 0 0 auto; min-width: 26px; height: 22px; padding: 0 6px;
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--accent); color: #fff; border-radius: 6px;
  font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums;
}
.num-badge--pick { background: var(--accent-text); }
.num-badge--soft { background: var(--chip-bg); color: var(--text); }
.card-title {
  margin: 0; font-size: 16px; line-height: 1.45; font-weight: 600;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  overflow-wrap: anywhere;
}
.card-title a { color: var(--text); }
.card-title a:hover { color: var(--accent); text-decoration: none; }
.summary {
  margin: 0; font-size: 14px; color: var(--text-2);
  overflow-wrap: anywhere;
}
.card-foot {
  margin-top: auto; padding-top: 6px;
  display: flex; align-items: center; flex-wrap: wrap; gap: 6px;
  border-top: 1px dashed var(--border);
  font-size: 13px; color: var(--text-2);
}
.chip {
  display: inline-flex; align-items: center; gap: 5px;
  background: var(--chip-bg); border-radius: 6px; padding: 1px 8px;
  max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.chip--why { color: var(--accent-text); }
.lang-dot { width: 9px; height: 9px; border-radius: 50%; flex: 0 0 auto; }
.card-foot .spacer { flex: 1 1 auto; }
.time-text { font-variant-numeric: tabular-nums; white-space: nowrap; }
.ext-icon { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 2; flex: 0 0 auto; }

/* 推荐理由块 */
.why {
  background: var(--accent-soft); border-radius: 8px;
  padding: 9px 12px; font-size: 13px; color: var(--text);
}
.why-title {
  display: block; font-weight: 600; color: var(--accent-text);
  font-size: 12.5px; letter-spacing: .2px; margin-bottom: 4px;
}
.why ul { margin: 0; padding: 0; list-style: none; }
.why li { position: relative; padding-left: 16px; margin: 2px 0; overflow-wrap: anywhere; }
.why li::before {
  content: "✓"; position: absolute; left: 0; top: 0;
  color: var(--accent-text); font-weight: 700;
}
.why li.is-caution::before { content: "!"; }
.why li.is-caution { color: var(--danger-text); }

/* 已推送交叉引用 */
.pushed-ref {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: 12px; color: var(--accent-text); background: var(--accent-soft);
  border-radius: 6px; padding: 1px 7px; cursor: pointer;
}
.score-pill {
  font-variant-numeric: tabular-nums; font-weight: 600;
  background: var(--accent-soft); color: var(--accent-text);
  border-radius: 6px; padding: 1px 8px; font-size: 12.5px;
}

/* ---------- 空状态 ---------- */
.empty-state {
  margin: 48px auto; max-width: 640px; text-align: center;
  background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 40px 28px;
}
.empty-state .big { font-size: 40px; margin-bottom: 8px; }
.empty-state h2 { margin: 0 0 10px; font-size: 20px; }
.empty-state p { margin: 6px 0; color: var(--text-2); font-size: 14px; }
.empty-inline { padding: 28px 20px; text-align: center; color: var(--text-2); font-size: 14px; }

/* ---------- 页脚 ---------- */
footer {
  border-top: 1px solid var(--border); padding: 24px 0 40px;
  font-size: 13px; color: var(--text-2);
}
footer p { margin: 4px 0; }
footer .total { color: var(--text); font-weight: 600; }

@media (max-width: 480px) {
  .hero h1 { font-size: 22px; }
  .kpi .num { font-size: 26px; }
  .theme-toggle { top: 32px; }
  .search-panel { padding: 14px; }
}
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  *, *::before, *::after { transition: none !important; animation: none !important; }
}
</style>
</head>

  <!-- ============ 资讯版块 ============ -->

    <p id="emptySource"></p>
    <p id="emptyRerun"></p>
    <p>你仍然可以使用上方的 GitHub 搜索功能。</p>
  </div>
</main>

<footer>
  <div class="wrap" id="footerRoot"></div>
</footer>

/* ================= 时间：统一北京时间（UTC+8，手写偏移，不依赖访客时区） ================= */
const CN_OFFSET = 8 * 60 * 60 * 1000;

function toCN(iso) {
  const t = Date.parse(iso);
  if (Number.isNaN(t)) return null;
  return new Date(t + CN_OFFSET); // 用 getUTC* 系列读取即为北京时间
}

function pad2(n) { return String(n).padStart(2, '0'); }

function sameDayCN(a, b) { // a: toCN 结果, b: new Date(now + CN_OFFSET)
  return a.getUTCDate() === b.getUTCDate()
    && a.getUTCMonth() === b.getUTCMonth()
    && a.getUTCFullYear() === b.getUTCFullYear();
}

function isTodayCN(iso, now) {
  const cn = toCN(iso);
  if (!cn) return false;
  return sameDayCN(cn, new Date((now == null ? Date.now() : now) + CN_OFFSET));
}

/* 相对时间：卡片用 */
function fmtRelative(iso, now = Date.now()) {
  const cn = toCN(iso);
  if (!cn) return '时间未知';
  const diff = now - Date.parse(iso);
  if (diff < 60e3) return '刚刚'; // 含未来时间（时钟偏差）
  if (diff < 3600e3) return `${Math.floor(diff / 60e3)} 分钟前`;
  const d = new Date(now + CN_OFFSET);
  const sameDay = sameDayCN(cn, d);
  if (diff < 86400e3 && sameDay) return `${Math.floor(diff / 3600e3)} 小时前`;
  const hm = `${pad2(cn.getUTCHours())}:${pad2(cn.getUTCMinutes())}`;
  if (sameDay) return `今天 ${hm}`;
  const yest = new Date(now + CN_OFFSET - 86400e3);
  if (sameDayCN(cn, yest)) return `昨天 ${hm}`;
  if (diff < 7 * 86400e3) return `${cn.getUTCMonth() + 1}月${cn.getUTCDate()}日 ${hm}`;
  return `${cn.getUTCFullYear()}年${cn.getUTCMonth() + 1}月${cn.getUTCDate()}日`;
}

/* 绝对时间：Hero 与页脚用 */
function fmtAbsolute(iso, now = Date.now()) {
  const cn = toCN(iso);
  if (!cn) return '时间未知';
  const hm = `${pad2(cn.getUTCHours())}:${pad2(cn.getUTCMinutes())}`;
  const today = new Date(now + CN_OFFSET);
  const yest = new Date(now + CN_OFFSET - 86400e3);
  if (sameDayCN(cn, today)) return `今天 ${hm}`;
  if (sameDayCN(cn, yest)) return `昨天 ${hm}`;
  if (cn.getUTCFullYear() === today.getUTCFullYear()) {
    return `${cn.getUTCMonth() + 1}月${cn.getUTCDate()}日 ${hm}`;
  }
  return `${cn.getUTCFullYear()}年${cn.getUTCMonth() + 1}月${cn.getUTCDate()}日 ${hm}`;
}

/* 距今多少天（用于打分，负数按 0 处理） */
function daysAgo(iso) {
  const t = Date.parse(iso);
  if (Number.isNaN(t)) return null;
  return Math.max(0, (Date.now() - t) / 86400e3);
}

/* ================= 安全与清洗 ================= */
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}

function isValidUrl(u) {
  if (typeof u !== 'string') return false;
  const s = u.trim();
  if (!/^https?:\/\//i.test(s)) return false;
  try { new URL(s); return true; } catch (e) { return false; }
}

/* 摘要：去 HTML 标签、去 Markdown 语法、压缩空白、按 Unicode 字符截断至 60 字 */
function cleanSummary(raw, titleFallback, max) {
  const limit = max == null ? 60 : max;
  let s = raw == null ? '' : String(raw);
  s = s.replace(/<[^>]*>/g, ' ');
  s = s.replace(/!\[[^\]]*\]\([^)]*\)/g, ' ');
  s = s.replace(/\[([^\]]*)\]\([^)]*\)/g, '$1');
  s = s.replace(/[*_`~#>]/g, '');
  s = s.replace(/\s+/g, ' ').trim();
  if (!s) {
    const t = titleFallback ? String(titleFallback).trim() : '';
    s = t ? `${t}（原文无摘要）` : '（原文无摘要）';
  }
  const chars = [...s];
  if (chars.length > limit) {
    let cut = chars.slice(0, limit - 1).join('');   // 为省略号留 1 个字符位，总长不超过 limit
    /* 英文等含空格文本回退到最近词边界，避免把单词截成两半；中文无空格不受影响 */
    if (/[A-Za-z0-9]$/.test(cut) && cut.indexOf(' ') > 0 && /[A-Za-z]/.test(cut)) {
      const trimmed = cut.replace(/\s+\S*$/, '');
      if ([...trimmed].length >= Math.floor(limit * 0.5)) cut = trimmed;
    }
    s = cut.replace(/[\s,;:.、，；：]+$/, '') + '…';
  }
  return s;
}

function numOrNull(v) {
  const n = Number(v);
  return (v == null || v === '' || Number.isNaN(n)) ? null : n;
}

function formatStars(n) {
  const v = numOrNull(n);
  if (v == null) return '';
  if (v >= 1000) {
    const k = v / 1000;
    return (k >= 100 ? Math.round(k) : (Number.isInteger(k) ? String(k) : k.toFixed(1))) + 'k';
  }
  return String(v);
}

/* 大数人话：14.7 万 */
function humanCount(n) {
  const v = numOrNull(n);
  if (v == null) return '';
  if (v >= 10000) {
    const w = v / 10000;
    const s = w >= 100 ? String(Math.round(w)) : (Number.isInteger(w) ? String(w) : w.toFixed(1));
    return s + ' 万';
  }
  return String(v);
}

/* =====================================================================
 * 1. 可解释推荐引擎
 *    scoreRepo(item) → { score, reasons[], direction }
 *    reasons 里每一条都必须能追溯到仓库的真实字段：
 *      name/description/topics/language/stars/forks/pushed_at/created_at/size/archived
 * ===================================================================== */
function profileHaystack(it) {
  return [it.title, it.source, it.summary, it.language || '',
    Array.isArray(it.topics) ? it.topics.join(' ') : '', it.tag || '']
    .join(' ').toLowerCase();
}

/* 关键词匹配：要求命中发生在词首（前一字符不是字母/数字），避免
 * "script" 命中 "TypeScript"、"test" 命中 "latest" 这类假阳性，
 * 同时保留 "test" → "testing" 这类词形变化。 */
const KW_RE_CACHE = new Map();
function kwRegex(kw) {
  const k = String(kw).toLowerCase();
  let re = KW_RE_CACHE.get(k);
  if (!re) {
    const esc = k.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    re = new RegExp('(^|[^a-z0-9])' + esc);
    KW_RE_CACHE.set(k, re);
  }
  return re;
}

/* 命中哪些方向，返回按权重排序的命中列表 */
function matchDirections(it) {
  const hay = profileHaystack(it);
  if (!hay.trim()) return [];
  const hits = [];
  for (const d of USER_PROFILE.directions) {
    let n = 0;
    const matched = [];
    for (const kw of d.keywords) {
      if (kwRegex(kw).test(hay)) { n++; if (matched.length < 3) matched.push(kw); }
    }
    if (n > 0) hits.push({ d, n, matched, w: d.weight + Math.min(n, 3) * 5 });
  }
  hits.sort((a, b) => b.w - a.w || a.d.id.localeCompare(b.d.id));
  return hits;
}

function scoreRepo(it) {
  const reasons = [];
  let score = 0;
  const hits = matchDirections(it);
  const dir = hits.length ? hits[0].d : null;
  /* prio 越小越靠前展示；caution 的文案统一排在正面理由之后 */
  const add = (prio, text, caution) => reasons.push({ prio, text, caution: !!caution });

  /* 维度 1：方向命中（最强信号） */
  hits.slice(0, 2).forEach((h, i) => {
    score += h.w;
    add(1 + i, `命中你的「${h.d.label}」方向 · ${h.d.why}（匹配 ${h.n} 个关键词：${h.matched.join('、')}）`);
  });

  /* 维度 2：技术栈语言 */
  const lang = it.language ? String(it.language) : null;
  if (lang && USER_PROFILE.languages.includes(lang)) {
    score += 14;
    add(3, `主语言 ${lang} 已在你的技术栈内，可以直接读代码改代码`);
  } else if (lang) {
    score -= 6;
    add(12, `主语言 ${lang} 不在你的常用栈里，上手需要额外补语言成本`, true);
  } else {
    score -= 2;
  }

  /* 维度 3：上手门槛（仓库体积）—— 回答「我能不能用得起来」 */
  const sizeKb = numOrNull(it.sizeKb);
  if (sizeKb != null) {
    if (sizeKb <= 5120) { score += 6; add(4, `仓库体积约 ${Math.max(1, Math.round(sizeKb / 1024))} MB，轻量、适合直接上手改造`); }
    else if (sizeKb <= 51200) { score += 3; add(4, `仓库体积约 ${Math.round(sizeKb / 1024)} MB，规模可控`); }
    else if (sizeKb > 204800) { score -= 6; add(14, `仓库超过 ${Math.round(sizeKb / 1024)} MB，体量偏大，建议先只读文档与示例目录`, true); }
  }

  /* 维度 4：维护活跃度（pushed_at）—— 回答「值不值得投入」 */
  const dPushed = daysAgo(it.pushedAt || it.publishedAt);
  if (dPushed != null) {
    if (dPushed <= 7) { score += 10; add(5, `最近 ${dPushed < 1 ? '一天内' : Math.round(dPushed) + ' 天'}仍有提交，维护活跃，遇到问题能等到修复`); }
    else if (dPushed <= 30) { score += 7; add(5, `最近一个月内有提交，项目仍在维护`); }
    else if (dPushed <= 90) { score += 4; add(5, `最近三个月内有提交，维护节奏偏慢`); }
    else if (dPushed <= 365) { score += 1; add(13, `已 ${Math.round(dPushed / 30)} 个月没有新提交，建议先观望`, true); }
    else { score -= 8; add(11, `已超过一年没有提交，大概率已停止维护`, true); }
  }

  /* 维度 5：热度（star 数卡片底部已有 chip，这里主要参与打分） */
  const stars = numOrNull(it.stars);
  if (stars != null) {
    if (stars >= 100000) { score += 12; add(6, `★ ${humanCount(stars)} star，生态成熟、文档与社区问题都有现成答案`); }
    else if (stars >= 20000) { score += 10; add(6, `★ ${humanCount(stars)} star，主流项目，踩坑资料充足`); }
    else if (stars >= 5000) { score += 8; add(6, `★ ${humanCount(stars)} star，社区活跃度中等偏上`); }
    else if (stars >= 1000) { score += 6; add(6, `★ ${humanCount(stars)} star，规模适中，适合作为参考实现`); }
    else if (stars >= 200) { score += 3; add(6, `★ ${humanCount(stars)} star，小众项目，竞争小但可参考资料有限`); }
    else { score += 1; }
  }

  /* 维度 6：生态采用度（forks） */
  const forks = numOrNull(it.forks);
  if (forks != null && forks >= 3000) {
    score += 4;
    add(7, `被 fork ${humanCount(forks)} 次，说明已被大量项目实际采用`);
  }

  /* 维度 7：项目新旧（created_at） */
  const dCreated = daysAgo(it.createdAt);
  if (dCreated != null && dCreated <= 365) {
    score += 4;
    add(8, `创建不到一年，属于上升期项目，跟进性价比高`);
  }

  /* 维度 8：归档（一票否决级） */
  if (it.archived === true) {
    score -= 60;
    add(10, `项目已归档（只读），只能作为参考实现，不能作为选型`, true);
  }

  /* 维度 9：已推送过去重，避免每次刷新都推同一批 */
  if (pushedKeys().has(itemKey(it))) {
    score -= 15;
    add(15, `你之前已经看过这条推送`, true);
  }

  /* 理由排序：优先回答「能不能用 → 值不值得用 → 热不热」，取 3 条正面 + 1 条风险提醒 */
  const pos = reasons.filter(r => !r.caution).sort((a, b) => a.prio - b.prio);
  const neg = reasons.filter(r => r.caution).sort((a, b) => a.prio - b.prio);
  const top = pos.slice(0, 3).concat(neg.slice(0, 1));

  return { score, reasons: top, direction: dir ? dir.label : null, hits: hits.map(h => h.d.label) };
}

function itemKey(it) {
  const u = isValidUrl(it.url) ? it.url.trim() : '';
  return u || ('t:' + String(it.title || '').trim());
}

/* ================= 已读/已推送记忆（localStorage，失败静默） ================= */
const LS_PUSHED = 'gh-dash-pushed';
let pushedSetCache = null;

function pushedKeys() {
  if (pushedSetCache) return pushedSetCache;
  let arr = [];
  try { arr = JSON.parse(localStorage.getItem(LS_PUSHED) || '[]'); } catch (e) { arr = []; }
  pushedSetCache = new Set(Array.isArray(arr) ? arr : []);
  return pushedSetCache;
}

function markPushed(keys) {
  const set = pushedKeys();
  for (const k of keys) set.add(k);
  const arr = [...set].slice(-500); // 只保留最近 500 条，避免无限膨胀
  try { localStorage.setItem(LS_PUSHED, JSON.stringify(arr)); } catch (e) {}
}

function clearPushed() {
  pushedSetCache = new Set();
  try { localStorage.removeItem(LS_PUSHED); } catch (e) {}
}

function classifyType(item) {
  const t = item && item.type != null ? String(item.type) : '';
  if (t === 'trending' || t === 'repo' || t === 'repository') return 'trending';
  if (t === 'release' || t === 'update') return 'releases';
  if (t === 'news') return 'news';
  if (t === 'paper' || t === 'article') return 'papers';
  if (t === 'tip' || t === 'opinion') return 'tips';
  if (numOrNull(item && item.starsToday) != null) return 'trending';
  return 'other';
}

/* 同 url 或同 title 去重，保留 publishedAt 最早一条；无 url 且无 title 的条目不参与去重 */
function dedupItems(items) {
  const byKey = new Map();    // 归并键 -> 条目
  const urlToKey = new Map(); // url -> 归并键
  const titleToKey = new Map();
  let anon = 0;
  const ts = it => {
    const t = Date.parse(it && it.publishedAt || '');
    return Number.isNaN(t) ? Infinity : t;
  };
  for (const it of items) {
    const url = isValidUrl(it.url) ? it.url.trim() : '';
    const title = it.title != null ? String(it.title).trim() : '';
    let key = (url && urlToKey.get(url)) || (title && titleToKey.get(title));
    if (!key) {
      key = url || (title ? 't:' + title : 'anon:' + (++anon));
      byKey.set(key, it);
    } else if (ts(it) < ts(byKey.get(key))) {
      byKey.set(key, it);
    }
    if (url) urlToKey.set(url, key);
    if (title) titleToKey.set(title, key);
  }
  return [...byKey.values()];
}

function compareItems(a, b) { // publishedAt 倒序；相同或缺失按 title 本地化升序
  const ta = Date.parse(a.publishedAt || '');
  const tb = Date.parse(b.publishedAt || '');
  const va = Number.isNaN(ta) ? -Infinity : ta;
  const vb = Number.isNaN(tb) ? -Infinity : tb;
  if (va !== vb) return vb - va;
  return String(a.title || '').localeCompare(String(b.title || ''), 'zh-Hans-CN');
}

/* 把任意来源的条目归一化成统一形状（资讯卡片 + 打分 + 搜索都要用） */
function normalizeItem(it) {
  const rawTitle = it && it.title != null ? String(it.title).trim() : '';
  return {
    title: rawTitle || '（无标题）',
    url: isValidUrl(it && it.url) ? it.url.trim() : null,
    source: it && it.source != null && String(it.source).trim() ? String(it.source).trim() : '来源未知',
    summary: cleanSummary(it && it.summary, rawTitle),
    iso: it && typeof it.publishedAt === 'string' && !Number.isNaN(Date.parse(it.publishedAt)) ? it.publishedAt : null,
    stars: numOrNull(it && it.stars),
    starsToday: numOrNull(it && it.starsToday),
    language: it && it.language ? String(it.language) : null,
    tag: it && it.tag ? String(it.tag) : null,
    topics: it && Array.isArray(it.topics) ? it.topics.filter(x => typeof x === 'string') : [],
    forks: numOrNull(it && it.forks),
    openIssues: numOrNull(it && it.openIssues),
    archived: !!(it && it.archived),
    createdAt: it && typeof it.createdAt === 'string' ? it.createdAt : null,
    pushedAt: it && typeof it.pushedAt === 'string' ? it.pushedAt : null,
    sizeKb: numOrNull(it && it.sizeKb),
    type: it && it.type != null ? String(it.type) : ''
  };
}

function enrichItem(it, num) {
  return Object.assign(normalizeItem(it), { num });
}

/* 数据管线：扁平化 → 去重 → 归类 → 排序 → 全局连续编号 */
function processData(data) {
  const all = [];
  const secs = Array.isArray(data && data.sections) ? data.sections : [];
  for (const s of secs) {
    const items = s && Array.isArray(s.items) ? s.items : [];
    for (const it of items) if (it && typeof it === 'object') all.push(it);
  }
  const deduped = dedupItems(all);
  const buckets = new Map(SECTION_DEFS.map(d => [d.id, []]));
  for (const it of deduped) buckets.get(classifyType(it)).push(it);

  let n = 0, minTs = Infinity, maxTs = -Infinity;
  const sections = [];
  for (const def of SECTION_DEFS) {
    const arr = buckets.get(def.id);
    arr.sort(compareItems);
    if (!arr.length) continue; // 0 条版块整体不渲染
    sections.push({ id: def.id, name: def.name, icon: def.icon, items: arr.map(it => enrichItem(it, ++n)) });
  }
  for (const it of deduped) {
    const t = Date.parse(it.publishedAt || '');
    if (!Number.isNaN(t)) { if (t < minTs) minTs = t; if (t > maxTs) maxTs = t; }
  }
  return {
    sections, total: n,
    minTs: minTs === Infinity ? null : minTs,
    maxTs: maxTs === -Infinity ? null : maxTs,
    pool: deduped.map(normalizeItem) // 推送引擎的候选池
  };
}

/* 回退判定：isFallback 为真，或 generatedAt 不在北京当天自然日 */
function needsFallbackBanner(data, now) {
  if (data && data.isFallback === true) return true;
  if (!data || typeof data.generatedAt !== 'string') return true;
  return !isTodayCN(data.generatedAt, now == null ? Date.now() : now);
}

/* =====================================================================
 * 2. 推送引擎
 * ===================================================================== */
let pushPage = 0;

/* 只对「仓库类」条目做推荐：新闻/论文不适合作为"你可以用的项目" */
const PUSHABLE_TYPES = ['trending', 'tips', 'other'];

function buildPicks(pool, page, batch) {
  const size = batch == null ? PUSH_BATCH : batch;
  const scored = pool
    .filter(it => PUSHABLE_TYPES.includes(classifyType(it)))
    .map(it => Object.assign({ it }, scoreRepo(it)))
    .filter(s => s.score > 0)
    .sort((a, b) => b.score - a.score
      || (b.it.stars || 0) - (a.it.stars || 0)
      || String(a.it.title).localeCompare(String(b.it.title), 'zh-Hans-CN'));

  const total = scored.length;
  if (!total) return { picks: [], total: 0, pageCount: 1, page: 0 };
  const pageCount = Math.max(1, Math.ceil(total / size));
  const p = ((page % pageCount) + pageCount) % pageCount;
  const start = p * size;
  const slice = scored.slice(start, start + size);
  return {
    picks: slice.map((s, i) => Object.assign({}, s, { num: PUSH_PREFIX + (start + i + 1) })),
    total, pageCount, page: p
  };
}

/* =====================================================================
 * 3. GitHub 实时搜索
 * ===================================================================== */
const searchCache = new Map();
let searchAbort = null;
let searchSort = 'score';
let lastSearchQuery = '';
let lastSearchPool = [];   // 最近一次搜索的原始候选池（用于切换排序时不重复请求）

/* 输入 → GitHub 查询串：识别限定符，没有限定符时补默认字段范围 */
const QUALIFIER_RE = /\b(in|language|lang|stars|forks|topic|topics|pushed|created|updated|user|org|license|size|archived|good-first-issues|help-wanted-issues|is)\s*:\s*\S+/i;
function buildGhQuery(raw) {
  const q = String(raw || '').trim();
  if (!q) return '';
  if (QUALIFIER_RE.test(q)) return q.replace(/\blang\s*:/gi, 'language:');
  return `${q} in:name,description,topics`;
}

/* GitHub 仓库对象 → 统一条目形状 */
function fromGhApi(r) {
  return normalizeItem({
    title: r.full_name,
    url: r.html_url,
    source: r.full_name,
    summary: r.description || '',
    publishedAt: r.pushed_at || r.updated_at || r.created_at,
    type: classifyRepoType(r),
    language: r.language,
    stars: r.stargazers_count,
    topics: r.topics,
    forks: r.forks_count,
    openIssues: r.open_issues_count,
    archived: r.archived,
    createdAt: r.created_at,
    pushedAt: r.pushed_at,
    sizeKb: r.size
  });
}

function classifyRepoType(r) {
  const hay = [r.full_name, r.description || '', (r.topics || []).join(' ')].join(' ').toLowerCase();
  if (/(awesome|cheatsheet|cheat-sheet|tutorial|guide|learning|roadmap|handbook|best-practices)/.test(hay)) return 'tips';
  return 'trending';
}

function readRateLimit(res) {
  const rem = res.headers.get('x-ratelimit-remaining');
  const reset = res.headers.get('x-ratelimit-reset');
  return {
    remaining: rem == null ? null : Number(rem),
    resetISO: reset ? new Date(Number(reset) * 1000).toISOString() : null
  };
}

/* 返回 { items, rate, total, degraded, error, offline } —— 永不抛错，失败即降级 */
async function fetchGitHubSearch(rawQuery) {
  const q = buildGhQuery(rawQuery);
  if (!q) return { items: [], degraded: true, error: '请输入搜索内容' };
  const url = `${GH_API}?q=${encodeURIComponent(q)}&sort=stars&order=desc&per_page=${SEARCH_POOL}`;
  const controller = typeof AbortController !== 'undefined' ? new AbortController() : null;
  if (searchAbort && searchAbort.abort) searchAbort.abort(); // 取消上一次未完成请求，避免竞态
  searchAbort = controller;
  try {
    const res = await fetch(url, {
      headers: { Accept: 'application/vnd.github+json' },
      signal: controller ? controller.signal : undefined
    });
    const rate = readRateLimit(res);
    if (res.status === 403 || res.status === 429) {
      return { items: [], degraded: true, offline: false, rate,
        error: rate.remaining === 0
          ? `GitHub 搜索接口限流：匿名调用每分钟 10 次，已用完，约 ${rate.resetISO ? fmtRelative(rate.resetISO) : '稍后'}恢复`
          : 'GitHub 拒绝了本次请求（403/429），稍后再试' };
    }
    if (res.status === 422) {
      return { items: [], degraded: true, offline: false, rate, error: '查询语法不被 GitHub 接受，请检查限定符写法' };
    }
    if (!res.ok) {
      return { items: [], degraded: true, offline: false, rate, error: `GitHub 返回 HTTP ${res.status}` };
    }
    const json = await res.json();
    const items = (json.items || []).map(fromGhApi);
    return { items, rate, total: json.total_count || 0, degraded: false, offline: false };
  } catch (e) {
    if (e && e.name === 'AbortError') return { aborted: true, items: [], degraded: true };
    return { items: [], degraded: true, offline: true, error: '无法连接 GitHub（网络不可用或被拦截），已切换为本地索引结果' };
  }
}

/* 本地索引检索：多关键词 AND，命中标题/来源/摘要/语言/主题 */
function searchLocal(pool, rawQuery, limit) {
  const terms = String(rawQuery || '').toLowerCase()
    .replace(/\b(in|language|lang|stars|forks|topic|topics|pushed|created|updated|user|org|license|size|is)\s*:\s*\S+/gi, ' ')
    .split(/\s+/).filter(Boolean);
  if (!terms.length) return [];
  const scored = [];
  for (const it of pool) {
    const hay = profileHaystack(it);
    let hit = 0, strong = 0;
    for (const t of terms) {
      if (!hay.includes(t)) { hit = -1; break; }
      hit++;
      if (String(it.title || '').toLowerCase().includes(t)) strong++;
    }
    if (hit < 0) continue;
    scored.push({ it, s: hit + strong * 2 + (numOrNull(it.stars) || 0) / 1e5 });
  }
  scored.sort((a, b) => b.s - a.s);
  return scored.slice(0, limit == null ? SEARCH_MAX_RESULTS : limit).map(x => x.it);
}

/* 搜索主流程：GitHub 优先 + 本地补充，结果最多 SEARCH_MAX_RESULTS 条 */
async function runSearch(rawQuery) {
  const q = String(rawQuery || '').trim();
  if (!q) { renderSearchIdle(); return; }
  lastSearchQuery = q;

  const pool = processData(DASHBOARD_DATA).pool;
  const localHits = searchLocal(pool, q, SEARCH_MAX_RESULTS);

  const ck = q.toLowerCase() + '|' + SEARCH_POOL;
  const cached = searchCache.get(ck);
  if (cached && Date.now() - cached.at < SEARCH_CACHE_TTL) {
    renderSearchResult(cached.res, localHits, true);
    return;
  }

  setSearchStatus(`正在向 GitHub 查询「${q}」…`, '', { spinner: true });
  const res = await fetchGitHubSearch(q);
  if (res.aborted) return; // 已被更新的搜索取代
  if (!res.degraded && res.items.length) searchCache.set(ck, { at: Date.now(), res });
  renderSearchResult(res, localHits, false);
}

function renderSearchResult(res, localHits, fromCache) {
  lastSearchPool = Array.isArray(res.items) ? res.items : [];
  const items = sortSearchResults(lastSearchPool, searchSort).slice(0, SEARCH_MAX_RESULTS);

  if (res.degraded) {
    if (res.offline) {
      setSearchStatus(`${res.error}。下方展示本地索引命中的 ${localHits.length} 条。`, 'is-error');
    } else {
      const rem = res.rate && res.rate.remaining != null ? `（本次后剩余 ${res.rate.remaining} 次）` : '';
      setSearchStatus(`${res.error || '搜索失败'}${rem}`, 'is-warn');
    }
  } else if (!items.length) {
    setSearchStatus(`GitHub 上匹配「${lastSearchQuery}」的结果为 0 条，换个说法或去掉限定符再试。`, '');
  } else {
    const rateTxt = res.rate && res.rate.remaining != null ? ` · 本接口剩余额度 ${res.rate.remaining} 次` : '';
    const poolTxt = lastSearchPool.length > items.length
      ? `已取回 ${lastSearchPool.length} 个候选` : `命中 ${lastSearchPool.length} 个`;
    setSearchStatus(
      `GitHub 共匹配 ${humanCount(res.total)} 个仓库，${poolTxt}${fromCache ? '（缓存结果）' : ''}，按「${SORT_LABEL[searchSort]}」展示前 ${items.length} 条${rateTxt}`,
      '');
  }

  /* 本地命中提示：GitHub 结果之外，本期资讯里已有的相关条目 */
  const localBox = document.getElementById('localHits');
  if (localHits.length) {
    localBox.hidden = false;
    localBox.replaceChildren();
    localBox.appendChild(document.createTextNode(`本期资讯已收录 ${localHits.length} 条相关条目：`));
    for (const it of localHits.slice(0, 8)) {
      const a = el('a', null, it.title);
      a.href = '#card-' + encodeURIComponent(itemKey(it));
      a.style.marginRight = '10px';
      localBox.appendChild(a);
    }
  } else {
    localBox.hidden = true;
  }

  const box = document.getElementById('searchResults');
  box.replaceChildren();
  const bar = document.getElementById('resultBar');
  if (!items.length) {
    bar.hidden = true;
    if (res.degraded && localHits.length) {
      /* 离线降级：把本地命中当结果展示，并标注来源 */
      const grid = el('div', 'grid');
      localHits.forEach((it, i) => grid.appendChild(renderSearchCard(
        Object.assign({}, it, { num: SEARCH_PREFIX + (i + 1) }), true)));
      box.appendChild(grid);
    } else {
      box.appendChild(el('p', 'empty-inline', '没有可展示的结果。'));
    }
    return;
  }
  bar.hidden = false;
  document.getElementById('resultSummary').textContent = `共 ${items.length} 条结果`;
  for (const btn of document.querySelectorAll('#sortSeg button')) {
    btn.setAttribute('aria-pressed', String(btn.dataset.sort === searchSort));
  }
  const grid = el('div', 'grid');
  items.forEach((it, i) => grid.appendChild(renderSearchCard(
    Object.assign({}, it, { num: SEARCH_PREFIX + (i + 1) }), false)));
  box.appendChild(grid);
}

const SORT_LABEL = { score: '对你的推荐度', stars: 'Star 数', updated: '最近更新' };

function sortSearchResults(items, mode) {
  const arr = items.slice();
  if (mode === 'stars') {
    arr.sort((a, b) => (numOrNull(b.stars) || 0) - (numOrNull(a.stars) || 0));
  } else if (mode === 'updated') {
    arr.sort((a, b) => {
      const ta = Date.parse(b.pushedAt || b.iso || '') || 0;
      const tb = Date.parse(a.pushedAt || a.iso || '') || 0;
      return ta - tb;
    });
  } else {
    arr.sort((a, b) => {
      const sa = scoreRepo(a).score, sb = scoreRepo(b).score;
      return sb - sa || (numOrNull(b.stars) || 0) - (numOrNull(a.stars) || 0);
    });
  }
  return arr;
}

/* 状态文案统一走 textContent，绝不使用 innerHTML（用户输入不进 DOM 结构） */
function setSearchStatus(text, cls, opts) {
  const node = document.getElementById('searchStatus');
  node.className = 'search-status' + (cls ? ' ' + cls : '');
  node.replaceChildren();
  if (opts && opts.spinner) {
    node.appendChild(el('span', 'spinner'));
    node.appendChild(document.createTextNode(' '));
  }
  node.appendChild(document.createTextNode(text));
}

function renderSearchIdle() {
  lastSearchPool = [];
  document.getElementById('searchResults').replaceChildren();
  document.getElementById('resultBar').hidden = true;
  document.getElementById('localHits').hidden = true;
  setSearchStatus('未搜索。搜索会实时请求 GitHub 公开 API。', '');
}

/* =====================================================================
 * 4. 渲染（DOM API + textContent，数据不进 innerHTML）
 * ===================================================================== */
function el(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text != null) node.textContent = text;
  return node;
}

function extLinkSvg() {
  const NS = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(NS, 'svg');
  svg.setAttribute('viewBox', '0 0 24 24');
  svg.setAttribute('class', 'ext-icon');
  svg.setAttribute('aria-hidden', 'true');
  const path = document.createElementNS(NS, 'path');
  path.setAttribute('d', 'M14 4h6v6M20 4l-9 9M18 13v6a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h6');
  path.setAttribute('stroke-linecap', 'round');
  path.setAttribute('stroke-linejoin', 'round');
  svg.appendChild(path);
  return svg;
}

/* 推荐理由块 */
function renderWhy(reasons) {
  const box = el('div', 'why');
  box.appendChild(el('span', 'why-title', '为什么推荐给你'));
  const ul = el('ul');
  for (const r of reasons) {
    const li = el('li', r.caution ? 'is-caution' : null, r.text);
    ul.appendChild(li);
  }
  box.appendChild(ul);
  return box;
}

/* 卡片底行：来源 chip、语言点、star、tag、时间、外链 */
function footerFor(item, extraNodes) {
  const foot = el('div', 'card-foot');
  const srcChip = el('span', 'chip');
  if (item.language) {
    const dot = el('span', 'lang-dot');
    dot.style.backgroundColor = langColor(item.language);
    dot.title = item.language;
    srcChip.appendChild(dot);
  }
  srcChip.appendChild(document.createTextNode(item.source));
  foot.appendChild(srcChip);

  if (extraNodes) for (const n of extraNodes) if (n) foot.appendChild(n);
  if (item.stars != null) {
    const c = el('span', 'chip', '★ ' + formatStars(item.stars));
    c.title = `${item.stars} star`;
    foot.appendChild(c);
  }
  if (item.starsToday != null) foot.appendChild(el('span', 'chip', '今日 +' + formatStars(item.starsToday)));
  if (item.tag) foot.appendChild(el('span', 'chip', item.tag));
  foot.appendChild(el('span', 'spacer'));

  const time = el('span', 'time-text');
  if (item.iso) {
    time.dataset.iso = item.iso;
    time.textContent = fmtRelative(item.iso);
  } else {
    time.textContent = '时间未知';
  }
  foot.appendChild(time);
  if (item.url) foot.appendChild(extLinkSvg());
  return foot;
}

/* 标题节点：URL 非法时降级为纯文本 */
function titleNode(item, heading) {
  const title = el(heading || 'h3', 'card-title');
  if (item.url) {
    const a = el('a', null, item.title);
    a.href = item.url;
    a.target = '_blank';
    a.rel = 'noopener noreferrer';
    a.title = item.title;
    title.appendChild(a);
  } else {
    title.textContent = item.title;
    title.title = item.title;
  }
  return title;
}

/* 资讯卡片（保持原有结构） */
function renderCard(item, pushedRef) {
  const card = el('article', 'card');
  card.id = 'card-' + encodeURIComponent(itemKey({ url: item.url, title: item.title }));

  const head = el('div', 'card-head');
  head.appendChild(el('span', 'num-badge', String(item.num)));
  head.appendChild(titleNode(item, 'h3'));
  card.appendChild(head);

  card.appendChild(el('p', 'summary', item.summary));

  const extra = [];
  if (pushedRef) {
    const ref = el('span', 'pushed-ref', '🎯 已推送 ' + pushedRef);
    ref.title = '已在上方「为你智能推送」中出现，点击跳回';
    ref.addEventListener('click', () => {
      const target = document.getElementById('sec-picks');
      if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });
    extra.push(ref);
  }
  if (item.archived) extra.push(el('span', 'chip', '已归档'));
  card.appendChild(footerFor(item, extra));
  return card;
}

/* 推送卡片：比资讯卡片多一块「为什么推荐给你」 */
function renderPickCard(entry) {
  const item = entry.it;
  const card = el('article', 'card card--pick');
  card.id = 'pick-' + encodeURIComponent(itemKey(item));

  const head = el('div', 'card-head');
  head.appendChild(el('span', 'num-badge num-badge--pick', String(entry.num)));
  head.appendChild(titleNode(item, 'h3'));
  card.appendChild(head);

  const sumWrap = el('p', 'summary', item.summary);
  card.appendChild(sumWrap);

  card.appendChild(renderWhy(entry.reasons));
  card.appendChild(footerFor(item, [el('span', 'score-pill', '推荐分 ' + Math.round(entry.score))]));
  return card;
}

/* 搜索结果卡片 */
function renderSearchCard(item, fromLocal) {
  const card = el('article', 'card');
  const head = el('div', 'card-head');
  head.appendChild(el('span', 'num-badge num-badge--soft', String(item.num)));
  head.appendChild(titleNode(item, 'h3'));
  card.appendChild(head);

  const descText = item.summary && !/（原文无摘要）$/.test(item.summary)
    ? item.summary
    : '该仓库未填写描述';
  card.appendChild(el('p', 'summary', descText));

  const reasons = fromLocal
    ? [{ text: '来自本期已经推送的本地索引（离线可用）', caution: false }]
      .concat(scoreRepo(item).reasons.slice(0, 2))
    : scoreRepo(item).reasons;
  if (reasons.length) card.appendChild(renderWhy(reasons.slice(0, 4)));

  const extra = [];
  if (item.forks != null && item.forks >= 100) extra.push(el('span', 'chip', '⑂ ' + formatStars(item.forks)));
  if (item.archived) extra.push(el('span', 'chip', '已归档'));
  if (item.topics && item.topics.length) extra.push(el('span', 'chip', '#' + item.topics[0]));
  card.appendChild(footerFor(item, extra));
  return card;
}

/* =====================================================================
 * 5. 页面装配
 * ===================================================================== */
let currentPool = [];
let pushedIndex = new Map(); // 条目 key -> 推送编号，用于资讯卡片交叉引用

function renderPush(batch) {
  const pool = currentPool;
  const result = buildPicks(pool, pushPage, batch);
  const box = document.getElementById('pushResults');
  const label = document.getElementById('pushCount');
  box.replaceChildren();

  if (!result.total) {
    label.textContent = '0 条';
    box.appendChild(el('p', 'empty-inline', '本期数据里没有可用于推荐的仓库条目，试试上方的 GitHub 搜索。'));
    return;
  }
  label.textContent = `${result.picks.length} 条 · 第 ${result.page + 1}/${result.pageCount} 批`;

  pushedIndex = new Map();
  const grid = el('div', 'grid');
  for (const entry of result.picks) {
    pushedIndex.set(itemKey(entry.it), entry.num);
    grid.appendChild(renderPickCard(entry));
  }
  box.appendChild(grid);
}

function renderPushBasis(data) {
  const dirs = USER_PROFILE.directions.map(d => d.label);
  const node = document.getElementById('pushBasis');
  node.replaceChildren();
  node.appendChild(document.createTextNode(
    `依据你的能力画像（${dirs.join(' · ')}）对本期 ${currentPool.length} 个候选仓库打分排序；`));
  node.appendChild(document.createTextNode(
    '每条推荐都列出命中方向、语言匹配、star 规模、维护活跃度、上手门槛等可核对理由。'));
  if (data && data.source && data.source.directions && data.source.directions.length) {
    node.appendChild(document.createTextNode(` 自动流本次覆盖方向：${data.source.directions.map(d => d.label).join('、')}。`));
  }
}

function render(data) {
  const now = Date.now();
  const { sections, total, minTs, maxTs, pool } = processData(data);
  currentPool = pool;
  const src = (data && data.source) || {};
  const fallback = needsFallbackBanner(data, now);

  /* --- Hero 副标题 --- */
  const subParts = [];
  if (src.repo) subParts.push('数据源：' + src.repo);
  if (src.workflow) subParts.push(src.workflow);
  if (src.schedule) subParts.push('cron ' + src.schedule);
  document.getElementById('subtitle').textContent = subParts.length ? subParts.join(' · ') : 'GitHub 自动流';

  /* --- 回退提示条 --- */
  const banner = document.getElementById('fallbackBanner');
  if (fallback && total > 0) {
    banner.hidden = false;
    banner.replaceChildren();
    banner.appendChild(document.createTextNode('⚠ 当日自动流未取到数据，已回退至最近一次成功推送：'
      + fmtAbsolute(data.lastSuccessAt || data.generatedAt, now) + '。'));
    const sp = el('span', 'spacer'); banner.appendChild(sp);
    const btn = el('button', 'btn btn-ghost btn-sm', '重新检查更新');
    btn.type = 'button';
    btn.addEventListener('click', checkForUpdate);
    banner.appendChild(btn);
  } else {
    banner.hidden = true;
  }

  /* --- KPI 大数字 --- */
  const picks = buildPicks(pool, 0, PUSH_BATCH);
  const kpiRow = document.getElementById('kpiRow');
  kpiRow.replaceChildren();
  const kpis = [
    [String(total), '资讯总条数（条）'],
    [String(sections.length), '版块数（个）'],
    [String(picks.total), '可推荐项目（个）'],
    [minTs != null ? fmtAbsolute(new Date(minTs).toISOString(), now) + ' → ' + fmtAbsolute(new Date(maxTs).toISOString(), now) : '—', '本期时间跨度']
  ];
  for (const [num, label] of kpis) {
    const box = el('div', 'kpi');
    box.appendChild(el('span', 'num', num));
    box.appendChild(el('span', 'label', label));
    kpiRow.appendChild(box);
  }

  /* --- 各版块统计卡 + 搜索/推送入口 --- */
  const statCards = document.getElementById('statCards');
  statCards.replaceChildren();
  const mkStat = (icon, name, count, href) => {
    const a = el('a', 'stat-card');
    a.href = href;
    a.appendChild(document.createTextNode(icon + ' ' + name));
    a.appendChild(el('span', 'count', String(count)));
    statCards.appendChild(a);
  };
  mkStat('🔍', 'GitHub 搜索', '10 上限', '#sec-search');
  mkStat('🎯', '为你智能推送', picks.picks.length, '#sec-picks');
  for (const sec of sections) mkStat(sec.icon, sec.name, sec.items.length, '#sec-' + sec.id);

  /* --- 更新时间行 --- */
  const timeRow = document.getElementById('timeRow');
  timeRow.replaceChildren();
  const times = [
    ['数据生成时间', fmtAbsolute(data.generatedAt, now)],
    ['最近成功推送', fmtAbsolute(data.lastSuccessAt, now)],
    ['页面渲染时间', fmtAbsolute(new Date(now).toISOString(), now)]
  ];
  for (const [k, v] of times) {
    const span = el('span');
    span.appendChild(document.createTextNode(k + '：'));
    span.appendChild(el('b', null, v));
    timeRow.appendChild(span);
  }

  /* --- 空状态 --- */
  const nav = document.getElementById('anchorNav');
  const empty = document.getElementById('emptyState');
  const sectionsRoot = document.getElementById('sectionsRoot');
  sectionsRoot.replaceChildren();
  if (total === 0) {
    nav.hidden = false; // 搜索/推送锚点仍然可用
    empty.hidden = false;
    document.getElementById('emptySource').textContent =
      '数据源：' + (src.repo || '未知仓库') + (src.workflow ? ' · ' + src.workflow : '');
    const rerun = document.getElementById('emptyRerun');
    rerun.replaceChildren(document.createTextNode('可前往 Actions 手动重跑自动流'));
    if (isValidUrl(src.runUrl)) {
      const a = el('a', null, '（打开本次 run）');
      a.href = src.runUrl; a.target = '_blank'; a.rel = 'noopener noreferrer';
      rerun.appendChild(a);
    }
  } else {
    nav.hidden = false;
    empty.hidden = true;
  }

  /* --- 锚点导航（搜索 / 推送 / 资讯版块） --- */
  const navInner = document.getElementById('navInner');
  navInner.replaceChildren();
  const mkNav = (icon, name, href, count, key) => {
    const a = el('a', key ? 'nav-key' : null);
    a.href = href;
    a.dataset.sec = href.replace('#sec-', '');
    a.appendChild(document.createTextNode(icon + ' ' + name));
    if (count != null) a.appendChild(el('span', 'badge', String(count)));
    navInner.appendChild(a);
  };
  mkNav('🔍', '搜索', '#sec-search', null, true);
  mkNav('🎯', '为你推送', '#sec-picks', picks.picks.length, true);
  for (const sec of sections) mkNav(sec.icon, sec.name, '#sec-' + sec.id, sec.items.length, false);

  /* --- 推送区先渲染：pushedIndex 供下方资讯卡片做「已推送」交叉引用 --- */
  renderPushBasis(data);
  renderPush(PUSH_BATCH);

  /* --- 资讯版块与卡片 --- */
  for (const sec of sections) {
    const section = el('section', 'sec');
    section.id = 'sec-' + sec.id;
    const h2 = el('h2', null, sec.icon + ' ' + sec.name);
    h2.appendChild(el('span', 'sec-count', sec.items.length + ' 条'));
    section.appendChild(h2);
    const grid = el('div', 'grid');
    for (const item of sec.items) {
      const ref = pushedIndex.get(itemKey({ url: item.url, title: item.title }));
      grid.appendChild(renderCard(item, ref || null));
    }
    section.appendChild(grid);
    sectionsRoot.appendChild(section);
  }

  /* --- 搜索区回到初始态 --- */
  renderSearchIdle();

  /* --- 页脚 --- */
  const footer = document.getElementById('footerRoot');
  footer.replaceChildren();
  const pTotal = el('p');
  pTotal.appendChild(document.createTextNode('本期资讯共收录 '));
  pTotal.appendChild(el('span', 'total', String(total)));
  pTotal.appendChild(document.createTextNode(` 条（已去重）· 智能推送候选 ${picks.total} 个 · 搜索单次最多展示 ${SEARCH_MAX_RESULTS} 条`));
  footer.appendChild(pTotal);

  const srcLine = ['GitHub 自动流'];
  if (src.repo) srcLine.push('仓库 ' + src.repo);
  if (src.workflow) srcLine.push('workflow ' + src.workflow);
  if (src.schedule) srcLine.push('触发频率 cron ' + src.schedule);
  if (src.runId) srcLine.push('run id ' + src.runId);
  const pSrc = el('p');
  pSrc.textContent = '数据源：' + srcLine.join(' · ');
  if (isValidUrl(src.runUrl)) {
    pSrc.appendChild(document.createTextNode(' · '));
    const a = el('a', null, '查看本次 run');
    a.href = src.runUrl; a.target = '_blank'; a.rel = 'noopener noreferrer';
    pSrc.appendChild(a);
  }
  footer.appendChild(pSrc);
  if (src.scope) footer.appendChild(el('p', null, '抓取范围：' + src.scope));

  const dirLine = USER_PROFILE.directions.map(d => `${d.label}（权重 ${d.weight}）`).join('、');
  footer.appendChild(el('p', null, '推荐依据（画像方向与权重）：' + dirLine + '。'));
  footer.appendChild(el('p', null,
    `推送机制：每次打开页面按画像对候选池重新打分，推送 ${PUSH_BATCH} 条；已读记录存于浏览器本地，避免重复推荐；`
    + `每 ${Math.round(UPDATE_CHECK_INTERVAL / 60000)} 分钟检查一次是否有更新数据。`));

  const pReset = el('p');
  const resetLink = el('a', null, '重置推送已读记录');
  resetLink.href = '#sec-picks';
  resetLink.addEventListener('click', e => {
    e.preventDefault();
    clearPushed();
    pushPage = 0;
    persistPushPage();
    renderPush(PUSH_BATCH);
    scrollToPicks();
  });
  pReset.appendChild(resetLink);
  pReset.appendChild(document.createTextNode('（重置后会重新推荐你之前已看过的项目）'));
  footer.appendChild(pReset);

  footer.appendChild(el('p', null,
    `搜索数据源：GitHub 公开 Search API（${GH_API.replace('https://', '')}），匿名调用每分钟 10 次；`
    + '网络不可用或限流时自动回退为本地索引结果。'));

  if (fallback) {
    footer.appendChild(el('p', null,
      '回退说明：本次展示为最近一次成功推送的快照（' + fmtAbsolute(data.lastSuccessAt || data.generatedAt, now) + '）。'));
  }
  footer.appendChild(el('p', null, '生成时间：' + fmtAbsolute(data.generatedAt, now)));
  footer.appendChild(el('p', null, '免责声明：内容与 star 数来自 GitHub 公开数据，版权归原作者所有，卡片链接均跳转原文。'));

  observeSections();
}

/* ================= 导航高亮 ================= */
let observer = null;
function observeSections() {
  if (observer) observer.disconnect();
  const links = document.querySelectorAll('#navInner a');
  if (!links.length || !('IntersectionObserver' in window)) return;
  const map = new Map();
  links.forEach(a => map.set(a.dataset.sec, a));
  links.forEach(a => a.addEventListener('click', () => {
    links.forEach(x => x.classList.remove('active'));
    a.classList.add('active');
  }));
  observer = new IntersectionObserver(entries => {
    for (const en of entries) {
      if (!en.isIntersecting) continue;
      links.forEach(a => a.classList.remove('active'));
      const link = map.get(en.target.id.replace(/^sec-/, ''));
      if (link) link.classList.add('active');
    }
  }, { rootMargin: '-72px 0px -60% 0px', threshold: 0 });
  document.querySelectorAll('.sec, #sectionsRoot > .sec').forEach(s => observer.observe(s));
}

/* ================= 相对时间定时刷新（页面隐藏时暂停） ================= */
let timer = null;
function refreshTimes() {
  document.querySelectorAll('.time-text[data-iso]').forEach(node => {
    node.textContent = fmtRelative(node.dataset.iso);
  });
}
function startTimer() {
  stopTimer();
  timer = setInterval(() => { refreshTimes(); checkForUpdate(true); }, 60000);
}
function stopTimer() {
  if (timer != null) { clearInterval(timer); timer = null; }
}

/* ================= 数据更新检查（同源 data.json，失败静默） ================= */
let lastUpdateCheck = 0;
let updateNotified = false;
async function checkForUpdate(silent) {
  if (typeof fetch !== 'function') return;
  if (Date.now() - lastUpdateCheck < UPDATE_CHECK_INTERVAL) return;
  lastUpdateCheck = Date.now();
  try {
    const res = await fetch('data.json', { cache: 'no-store' });
    if (!res.ok) return;
    const latest = await res.json();
    const cur = Date.parse((DASHBOARD_DATA && DASHBOARD_DATA.generatedAt) || '') || 0;
    const nxt = Date.parse(latest && latest.generatedAt || '') || 0;
    if (nxt > cur && !updateNotified) {
      updateNotified = true;
      const b = document.getElementById('updateBanner');
      b.hidden = false;
      b.replaceChildren();
      b.appendChild(document.createTextNode(`🔄 检测到更新数据（${fmtAbsolute(latest.generatedAt)}），共 `
        + (Array.isArray(latest.sections) ? latest.sections.reduce((n, s) => n + ((s.items || []).length), 0) : 0)
        + ' 条。'));
      const sp = el('span', 'spacer'); b.appendChild(sp);
      const btn = el('button', 'btn btn-sm', '刷新页面');
      btn.type = 'button';
      btn.addEventListener('click', () => location.reload());
      b.appendChild(btn);
    }
  } catch (e) {
    /* file:// 打开或离线时静默忽略 */
    if (!silent) { /* 手动检查也保持一致，不打扰用户 */ }
  }
}

/* ================= 搜索区交互 ================= */
function initSearch() {
  const input = document.getElementById('searchInput');
  const btn = document.getElementById('searchBtn');
  const clearBtn = document.getElementById('searchClear');
  let debounceTimer = null;

  const fire = () => runSearch(input.value);
  input.addEventListener('input', () => {
    if (debounceTimer) clearTimeout(debounceTimer);
    const v = input.value.trim();
    if (!v) { renderSearchIdle(); return; }
    debounceTimer = setTimeout(fire, 450);
  });
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); if (debounceTimer) clearTimeout(debounceTimer); fire(); }
    if (e.key === 'Escape') { input.value = ''; renderSearchIdle(); }
  });
  btn.addEventListener('click', fire);
  clearBtn.addEventListener('click', () => { input.value = ''; renderSearchIdle(); input.focus(); });

  document.getElementById('sortSeg').addEventListener('click', e => {
    const b = e.target.closest('button[data-sort]');
    if (!b) return;
    searchSort = b.dataset.sort;
    if (lastSearchPool.length) {
      renderSearchResult({ items: lastSearchPool, degraded: false, total: lastSearchPool.length, rate: null }, [], true);
    } else if (lastSearchQuery) {
      fire();
    }
  });

  /* 快捷搜索：画像方向一键搜 */
  const chips = document.getElementById('quickChips');
  const quick = USER_PROFILE.directions.map(d => ({
    label: d.label, q: d.id === 'qa' ? 'testing automation language:python'
      : d.id === 'ai-agent' ? 'llm agent' : d.id === 'bigdata' ? 'spark data pipeline'
      : d.id === 'dataviz' ? 'dashboard visualization' : d.id === 'cv-ml' ? 'yolo detection'
      : d.id === 'java-web' ? 'spring boot' : d.id === 'ecommerce' ? 'price tracker scraper'
      : 'automation cli'
  })).concat([{ label: '近半年高星新项目', q: `stars:>2000 created:>${new Date(Date.now() - 180 * 86400e3).toISOString().slice(0, 10)}` }]);
  for (const item of quick) {
    const b = el('button', 'quick-chip', item.label);
    b.type = 'button';
    b.addEventListener('click', () => { input.value = item.q; fire(); });
    chips.appendChild(b);
  }

  /* 全局快捷键：/ 聚焦搜索 */
  document.addEventListener('keydown', e => {
    if (e.key === '/' && !/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement && document.activeElement.tagName)) {
      e.preventDefault();
      input.focus();
      input.select();
    }
  });
}

/* ================= 推送区交互 ================= */
function initPush() {
  const more = document.getElementById('pushMore');
  const readAll = document.getElementById('pushReadAll');

  more.addEventListener('click', () => {
    const keys = [...pushedIndex.keys()];
    markPushed(keys);          // 「换一批」即刻把当前这批记为已读，避免下一批又推回来
    pushPage += 1;
    persistPushPage();
    renderPush(PUSH_BATCH);
    scrollToPicks();
  });

  readAll.addEventListener('click', () => {
    markPushed([...pushedIndex.keys()]); // 记为本批已读，后续换批不再重复推同一条
    renderPush(PUSH_BATCH);
  });
}

function scrollToPicks() {
  const node = document.getElementById('sec-picks');
  if (node) node.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function persistPushPage() {
  try { localStorage.setItem('gh-dash-push-page', String(pushPage)); } catch (e) {}
}

function restorePushPage() {
  try {
    const v = Number(localStorage.getItem('gh-dash-push-page'));
    if (!Number.isNaN(v) && v >= 0) pushPage = v;
  } catch (e) {}
}

/* ================= 主题切换 ================= */
function initThemeToggle() {
  document.getElementById('themeToggle').addEventListener('click', () => {
    const cur = document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
    const next = cur === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    try { localStorage.setItem('gh-dash-theme', next); } catch (e) {}
  });
}

/* ================= 启动（Node 环境下跳过 DOM 初始化，便于单元测试） ================= */
if (typeof document !== 'undefined' && document.getElementById) {
  const boot = () => {
    restorePushPage();
    render(DASHBOARD_DATA);
    initThemeToggle();
    initSearch();
    initPush();
    startTimer();
    checkForUpdate(true);
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) { stopTimer(); } else { refreshTimes(); startTimer(); }
    });
  };
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }
}
</script>
